; PlatformIO users only. Arduino IDE users can ignore this file.
; Config taken from the Arduino-Pico documentation (PlatformIO page).
[platformio]
src_dir = hal/pico_main

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; lets pico_main.ino find core/ headers (see the __has_include in the sketch)
build_flags = -I core
